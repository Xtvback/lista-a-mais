name: Publicar imagem de alimentação aprovada
on:
  push:
    paths:
      - '.github/workflows/food-photo.yml'
      - 'scripts/install-food-photo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar-fotografia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/install-food-photo.py
      - name: Guardar nova imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/cartoes/alimentacao-nova.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publicar imagem de alimentação nova e exclusiva"
            git push
          fi
